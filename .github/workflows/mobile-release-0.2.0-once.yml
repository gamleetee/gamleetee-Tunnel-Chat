name: Verify Android Release 0.2.0

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android verification tools
        run: sdkmanager 'platform-tools' 'build-tools;36.0.0'

      - name: Download published release files
        shell: bash
        run: |
          set -euo pipefail
          base='https://github.com/gamleetee/gamleetee-Tunnel-Chat/releases/download/mobile-v0.2.0'
          mkdir -p artifacts
          for file in gamleetee-chat.apk gamleetee-chat.aab assetlinks.json SHA256SUMS.txt APK-SIGNATURE.txt; do
            curl --fail --location --retry 3 --retry-delay 2 \
              --output "artifacts/$file" "$base/$file"
            test -s "artifacts/$file"
          done

      - name: Validate file sizes and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c '%s' artifacts/gamleetee-chat.apk)" -gt 1000000
          test "$(stat -c '%s' artifacts/gamleetee-chat.aab)" -gt 1000000
          sha256sum --check artifacts/SHA256SUMS.txt

      - name: Validate version package and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk='artifacts/gamleetee-chat.apk'
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          expected_digest='57586CA8AB1A7957DE01206C2142A5E684B1D9760C17457B899204C47A65B7CD'

          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/apk-signature.txt
          actual_digest=$(awk -F': ' '/certificate SHA-256 digest/{print toupper($2); exit}' /tmp/apk-signature.txt)
          test "$actual_digest" = "$expected_digest"

          badging=$("$build_tools/aapt" dump badging "$apk")
          grep -F "package: name='ru.gamleetee.gamchat' versionCode='2' versionName='0.2.0'" <<<"$badging"
          grep -F "application-label:'gamchat'" <<<"$badging"

          jq -e --arg fingerprint '57:58:6C:A8:AB:1A:79:57:DE:01:20:6C:21:42:A5:E6:84:B1:D9:76:0C:17:45:7B:89:92:04:C4:7A:65:B7:CD' '
            length == 1 and
            .[0].target.namespace == "android_app" and
            .[0].target.package_name == "ru.gamleetee.gamchat" and
            .[0].target.sha256_cert_fingerprints == [$fingerprint]
          ' artifacts/assetlinks.json

          grep -Fi "$actual_digest" artifacts/APK-SIGNATURE.txt
