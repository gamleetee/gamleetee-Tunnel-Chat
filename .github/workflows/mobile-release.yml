name: Mobile Android Release

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без префикса, например 0.1.0'
        required: true
        type: string
      prerelease:
        description: 'Опубликовать как предварительный релиз'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: mobile-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag_name="$GITHUB_REF_NAME"
            version="${tag_name#mobile-v}"
            if [[ "$version" == *-* ]]; then
              prerelease=true
            else
              prerelease=false
            fi
          else
            version='${{ inputs.version }}'
            tag_name="mobile-v${version}"
            prerelease='${{ inputs.prerelease }}'
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Некорректная версия: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for variable in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!variable:-}" ]]; then
              echo "Не задан GitHub Secret: $variable" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/gamleetee-release.jks"
          chmod 600 "$RUNNER_TEMP/gamleetee-release.jks"
          test -s "$RUNNER_TEMP/gamleetee-release.jks"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Verify mobile configuration
        working-directory: mobile
        run: npm run verify

      - name: Build signed APK and AAB
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/gamleetee-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.release.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: npm run build:android:release

      - name: Verify release signature and prepare assets
        shell: bash
        run: |
          set -euo pipefail
          apk='mobile/android/app/build/outputs/apk/release/app-release.apk'
          aab='mobile/android/app/build/outputs/bundle/release/app-release.aab'
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          mkdir -p artifacts
          "$apksigner" verify --verbose --print-certs "$apk" \
            | tee artifacts/APK-SIGNATURE.txt

          certificate_digest=$(awk -F': ' \
            '/certificate SHA-256 digest/{print toupper($2); exit}' \
            artifacts/APK-SIGNATURE.txt)

          if [[ ! "$certificate_digest" =~ ^[0-9A-F]{64}$ ]]; then
            echo 'Не удалось определить SHA-256 сертификата APK.' >&2
            exit 1
          fi

          certificate_fingerprint=$(echo "$certificate_digest" \
            | sed 's/../&:/g; s/:$//')

          cp "$apk" artifacts/gamleetee-chat.apk
          cp "$aab" artifacts/gamleetee-chat.aab

          jq -n --arg fingerprint "$certificate_fingerprint" '
            [{
              relation: ["delegate_permission/common.handle_all_urls"],
              target: {
                namespace: "android_app",
                package_name: "ru.gamleetee.gamchat",
                sha256_cert_fingerprints: [$fingerprint]
              }
            }]
          ' > artifacts/assetlinks.json

          sha256sum \
            artifacts/gamleetee-chat.apk \
            artifacts/gamleetee-chat.aab \
            artifacts/assetlinks.json \
            > artifacts/SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > artifacts/RELEASE-NOTES.md <<EOF
          ## gamleetee Чат ${{ steps.release.outputs.version }}

          Официальная подписанная сборка Android.

          - `gamleetee-chat.apk` — установка напрямую на Android;
          - `gamleetee-chat.aab` — пакет для Google Play;
          - `assetlinks.json` — привязка Android App Links к сертификату релиза;
          - `SHA256SUMS.txt` — контрольные суммы файлов;
          - `APK-SIGNATURE.txt` — сведения о сертификате APK.

          Сервер не хранит сообщения и файлы. Ключ комнаты остаётся во фрагменте `#` ссылки-приглашения.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            artifacts/gamleetee-chat.apk
            artifacts/gamleetee-chat.aab
            artifacts/assetlinks.json
            artifacts/SHA256SUMS.txt
            artifacts/APK-SIGNATURE.txt
          )

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
            gh release edit "$TAG_NAME" \
              --title "gamleetee Чат $VERSION" \
              --notes-file artifacts/RELEASE-NOTES.md
          else
            arguments=(
              release create "$TAG_NAME"
              "${assets[@]}"
              --target "$GITHUB_SHA"
              --title "gamleetee Чат $VERSION"
              --notes-file artifacts/RELEASE-NOTES.md
            )
            if [[ "$PRERELEASE" == "true" ]]; then
              arguments+=(--prerelease)
            fi
            gh "${arguments[@]}"
          fi

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/gamleetee-release.jks"
