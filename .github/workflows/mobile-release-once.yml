name: Verify Android Release 0.1.0

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download published release files
        shell: bash
        run: |
          set -euo pipefail
          base='https://github.com/gamleetee/gamleetee-Tunnel-Chat/releases/download/mobile-v0.1.0'
          mkdir -p artifacts
          for file in gamleetee-chat.apk gamleetee-chat.aab assetlinks.json SHA256SUMS.txt APK-SIGNATURE.txt
          do
            curl --fail --location --retry 3 --retry-delay 2 \
              "$base/$file" \
              --output "artifacts/$file"
          done

      - name: Validate file sizes and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c '%s' artifacts/gamleetee-chat.apk)" -gt 1000000
          test "$(stat -c '%s' artifacts/gamleetee-chat.aab)" -gt 1000000
          sha256sum --check artifacts/SHA256SUMS.txt

      - name: Validate package and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          expected_colon='57:58:6C:A8:AB:1A:79:57:DE:01:20:6C:21:42:A5:E6:84:B1:D9:76:0C:17:45:7B:89:92:04:C4:7A:65:B7:CD'
          expected_plain='57586CA8AB1A7957DE01206C2142A5E684B1D9760C17457B899204C47A65B7CD'

          jq -e \
            --arg fingerprint "$expected_colon" \
            '.[0].target.namespace == "android_app"
             and .[0].target.package_name == "ru.gamleetee.gamchat"
             and .[0].target.sha256_cert_fingerprints == [$fingerprint]' \
            artifacts/assetlinks.json

          actual_plain=$(awk -F': ' \
            '/certificate SHA-256 digest/{print toupper($2); exit}' \
            artifacts/APK-SIGNATURE.txt)
          test "$actual_plain" = "$expected_plain"
